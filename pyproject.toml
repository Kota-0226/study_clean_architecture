[project]
name = "study-clean-architecture"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-html>=4.2.0",
]

[tool.pytest.ini_options]
testpaths = ["1st_try"]
# `uv run pytest` だけで、ターミナル表示とHTMLレポート生成の両方が走る
addopts = "-q --html=reports/report.html --self-contained-html"
